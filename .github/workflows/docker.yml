name: Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main → edge, Tag → latest + Tag-Name
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Lässt den Service bei mittwald das neue Image ziehen und neu starten.
      # Die Webhook-URL enthält ein Token und liegt deshalb im Secret MITTWALD_WEBHOOK_URL.
      - name: mittwald-Service aktualisieren
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          WEBHOOK_URL: ${{ secrets.MITTWALD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::Secret MITTWALD_WEBHOOK_URL nicht gesetzt – kein Redeploy."
            exit 0
          fi
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 60 "$WEBHOOK_URL"
