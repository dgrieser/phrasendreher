<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Testlabor · Phrasendreher</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='14' fill='%235a1a10' stroke='%23d9a945' stroke-width='6'/><path d='M50 22 64 50 50 78 36 50Z' fill='%23b3261e'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="test.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span>Phrasendreher</span>
      <span class="sep">/</span>
      <strong>Testlabor</strong>
    </div>
    <div class="chips">
      <span class="chip" id="modelChip">Modell …</span>
      <span class="chip" id="thinkChip">Thinking …</span>
    </div>
  </header>

  <main>
    <form id="form" class="card" autocomplete="off">
      <div class="card-head">
        <h2>Eingabe</h2>
        <button type="button" class="ghost" id="randomBtn">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="2.5" width="15" height="15" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="7" r="1.3"/><circle cx="13" cy="13" r="1.3"/><circle cx="13" cy="7" r="1.3"/><circle cx="7" cy="13" r="1.3"/></svg>
          Zufällig
        </button>
      </div>

      <div class="pair">
        <div class="field">
          <label for="a">Erste Redewendung</label>
          <select id="a" required></select>
        </div>
        <span class="plus" aria-hidden="true">+</span>
        <div class="field">
          <label for="b">Zweite Redewendung</label>
          <select id="b" required></select>
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="system">System-Prompt</label>
          <span class="hint"><span id="charCount">0</span> Zeichen · <button type="button" class="link" id="resetBtn">Zurücksetzen</button></span>
        </div>
        <textarea id="system" rows="14" spellcheck="false" maxlength="8000"></textarea>
      </div>

      <div class="field">
        <span class="label">Nachricht an das Modell</span>
        <div class="preview" id="userPreview">…</div>
      </div>

      <div class="actions">
        <span class="status" id="status" aria-live="polite"></span>
        <button type="button" class="secondary" id="stopBtn" hidden>Abbrechen</button>
        <button type="submit" class="primary" id="runBtn">Verdrehen</button>
      </div>
    </form>

    <section class="card">
      <div class="card-head">
        <h2>Denkprozess</h2>
        <span class="live" id="live" hidden><i></i> live</span>
      </div>
      <pre class="reasoning" id="reasoning" tabindex="0" aria-label="Denkprozess des Modells"><span class="placeholder">Hier erscheint das Denken des Modells, sobald es loslegt.</span></pre>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Ergebnis</h2>
        <button type="button" class="ghost" id="copyBtn" disabled>Kopieren</button>
      </div>
      <p class="result empty" id="result">Noch nichts verdreht.</p>
      <dl class="meta" id="meta">
        <div><dt>Dauer</dt><dd id="mTime">–</dd></div>
        <div><dt>Tokens</dt><dd id="mTokens">–</dd></div>
        <div><dt>Ende</dt><dd id="mFinish">–</dd></div>
      </dl>
      <details class="raw" id="rawBox" hidden>
        <summary>Rohantwort</summary>
        <pre id="raw"></pre>
      </details>
    </section>
  </main>

  <footer><a href="./">← Zum Automaten</a></footer>

  <script src="redewendungen.js"></script>
  <script src="dreher.js"></script>
  <script src="test.js"></script>
</body>
</html>
