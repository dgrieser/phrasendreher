<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phrasendreher</title>
  <meta name="description" content="Der einarmige Bandit für verdrehte Redewendungen. Hebel ziehen, Weisheit gewinnen.">
  <meta name="theme-color" content="#1a0a05">
  <meta property="og:title" content="Phrasendreher">
  <meta property="og:description" content="Der einarmige Bandit für verdrehte Redewendungen.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='14' fill='%235a1a10' stroke='%23d9a945' stroke-width='6'/><path d='M50 22 64 50 50 78 36 50Z' fill='%23b3261e'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@500;700;800;900&family=Libre+Caslon+Text:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ladebildschirm: steht sofort; loader.js zeigt den Fortschritt, machine3d.js meldet sich, sobald der Automat fertig ist.
       Dann erscheint „Starten“: der Druck darauf schaltet den Ton frei, danach fliegt die Kamera zum Automaten. -->
  <div class="loader" id="loader" role="status">
    <div class="loader-marquee">
      <div class="loader-bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="loader-plate">Phrasendreher</div>
      <div class="loader-bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <!-- Sichtfenster mit Fallblattanzeige statt Walzen -->
      <div class="flap-board" aria-hidden="true"></div>
    </div>
    <button type="button" class="button brass loader-start" id="startBtn" hidden>Starten</button>
    <p class="sr-only" id="loaderNote">Der Automat wird geladen …</p>
  </div>
  <script src="loader.js"></script>
  <div class="bokeh" id="bokeh" aria-hidden="true"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <header class="top">
    <button type="button" class="sound" id="soundBtn" aria-pressed="true" aria-label="Ton" title="Ton aus">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke-width="1.4"/>
        <g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g>
        <g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
      </svg>
    </button>
  </header>

  <main>
    <h1 class="sr-only">Phrasendreher</h1>
    <div class="machine">
      <!-- Der Automat: Render aus Blender, Walzen und Hebel live gezeichnet (machine3d.js, Modell in blender/) -->
      <div class="lever" id="lever" role="button" tabindex="0" aria-label="Hebel ziehen – neue Redewendung drehen"></div>
    </div>

    <p class="sr-only" id="phrase" aria-live="polite"></p>

    <div class="actions hidden" id="actions">
      <button type="button" class="button brass" id="shareBtn">Teilen</button>
      <button type="button" class="button brass" id="favBtn" aria-pressed="false">Merken</button>
    </div>

    <section class="archive">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="tabFav" aria-selected="true" aria-controls="favPanel">Gemerkt <span id="favCount"></span></button>
        <button type="button" role="tab" class="tab" id="tabHist" aria-selected="false" aria-controls="histPanel">Zuletzt</button>
      </div>
      <div id="favPanel" role="tabpanel">
        <ol class="list" id="favList"></ol>
        <p class="empty" id="favEmpty">Noch nichts gemerkt. Da liegt der Hase im Kettenhemd.</p>
      </div>
      <div id="histPanel" role="tabpanel" hidden>
        <ol class="list" id="historyList"></ol>
        <p class="empty" id="histEmpty">Noch nichts gedreht.</p>
      </div>
    </section>
  </main>

  <footer>Alle Weisheiten ohne Gewähr</footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="redewendungen.js"></script>
  <script src="dreher.js"></script>
  <script src="app.js"></script>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script type="module" src="machine3d.js"></script>
</body>
</html>
