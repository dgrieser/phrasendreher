<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phrasendreher</title>
  <meta name="description" content="Redewendungen, fachgerecht verdreht. Schieben, warten, staunen.">
  <meta name="theme-color" content="#0d0c0b">
  <meta property="og:title" content="Phrasendreher">
  <meta property="og:description" content="Redewendungen, fachgerecht verdreht.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d0c0b'/><text x='50' y='74' font-family='Georgia,serif' font-style='italic' font-size='72' text-anchor='middle' fill='%23d9b77e'>„</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <span class="number" id="counter">Nº 0</span>
    <button type="button" class="link" id="soundBtn" aria-pressed="true">Ton an</button>
  </header>

  <main>
    <div class="title">
      <h1>Phrasen<em>dreher</em></h1>
      <p class="tagline">Redewendungen, fachgerecht verdreht</p>
    </div>

    <section class="stage" id="stage" aria-label="Verdrehte Redewendung">
      <span class="mark mark-open" aria-hidden="true">„</span>
      <div class="reels" aria-hidden="true">
        <div class="reel"><div class="strip"></div></div>
        <div class="reel reel-accent"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
      </div>
      <span class="mark mark-close" aria-hidden="true">“</span>
      <p class="sr-only" id="phrase" aria-live="polite"></p>
    </section>

    <p class="status" id="note">&nbsp;</p>

    <div class="slider" id="slider" role="button" tabindex="0" aria-label="Zum Drehen schieben">
      <span class="slider-label" id="sliderLabel">Zum Drehen schieben</span>
      <div class="slider-knob" id="sliderThumb" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="actions" id="actions">
      <button type="button" class="pill" id="shareBtn">Teilen</button>
      <button type="button" class="pill" id="favBtn" aria-pressed="false">Merken</button>
    </div>

    <section class="archive">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="tabFav" aria-selected="true" aria-controls="favPanel">Gemerkt <span id="favCount"></span></button>
        <button type="button" role="tab" class="tab" id="tabHist" aria-selected="false" aria-controls="histPanel">Zuletzt</button>
      </div>
      <div id="favPanel" role="tabpanel">
        <ol class="list" id="favList"></ol>
        <p class="empty" id="favEmpty">Noch nichts gemerkt. Da liegt der Hase im Kettenhemd.</p>
      </div>
      <div id="histPanel" role="tabpanel" hidden>
        <ol class="list" id="historyList"></ol>
        <p class="empty" id="histEmpty">Noch nichts gedreht.</p>
      </div>
    </section>
  </main>

  <footer>Alle Weisheiten ohne Gewähr.</footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="redewendungen.js"></script>
  <script src="dreher.js"></script>
  <script src="app.js"></script>
</body>
</html>
